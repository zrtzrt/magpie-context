name: Test & Publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    # 必须跨平台跑: 这个插件读的是本机会话目录, 而 Windows 上 HOME 不存在、
    # 默认没有 zstd/grep、路径是盘符形式 —— 只在 ubuntu 上跑会让这三类缺陷
    # 永远绿着进主线 (v1.2.0 就是这么发出去的)。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # zstd*Sync 需要 Node >= 22.15; Node 20 缺该 API 会假绿/报错, 故不纳入。
        node: ['22', '24']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: bash
        run: |
          node -c daemon.mjs
          node -c dsh-events.mjs
          node -c dsh-fileops.mjs
      - name: Run tests
        # 用目录形式而不是 glob: Windows 的 cmd 不会展开 tests/*.test.mjs,
        # 交给 node --test 自己递归发现, 三个平台行为一致。
        run: node --test --test-concurrency=1 tests/

  publish:
    name: Publish to npm (OIDC Trusted Publishing)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release
      id-token: write   # OIDC trusted publishing (无需长期 token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm with OIDC support
        run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "tag 与 package.json 版本不一致"; exit 1; }
      - name: Check tarball contents (no session data / secrets)
        run: |
          TGZ="$(npm pack --silent | tail -n 1)"
          test -f "$TGZ" || { echo "npm pack 未产出 tarball"; exit 1; }
          echo "$TGZ" > tarball-name.txt
          tar -tzf "$TGZ" > tarball-files.txt
          # page/data/ 是本机会话正文分片，任何情况下都不能进包
          if grep -E '(^|/)(data/|usage-cluster|session\.v4|\.credentials)' tarball-files.txt; then
            echo "tarball 含私有数据"; exit 1
          fi
          # 索引必须在包里（否则装完插件页面 404），但只能是占位版本
          tar -xOzf "$TGZ" package/page/context-data.js > packed-index.js
          grep -q CONTEXT_DATA_PLACEHOLDER packed-index.js || { echo "tarball 里的索引不是占位版本"; exit 1; }
          grep -q 'window.CONTEXT_SESSIONS = \[\];' packed-index.js || { echo "tarball 里的索引含真实会话"; exit 1; }
          if grep -qE 'sk-[A-Za-z0-9]{16,}' packed-index.js; then echo "tarball 索引含密钥"; exit 1; fi
          echo "tarball files: $(wc -l < tarball-files.txt)"
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Create GitHub Release with tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGZ="$(cat tarball-name.txt)"
          gh release create "$GITHUB_REF_NAME" "$TGZ" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes