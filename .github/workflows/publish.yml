name: Test & Publish

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # zstd*Sync 需要 Node >= 22.15; Node 20 缺该 API 会假绿/报错, 故不纳入。
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node -c index.js
          node -c daemon.mjs
          node -c dsh-events.mjs
          node -c dsh-fileops.mjs
      - name: Run tests
        run: npm test

  publish:
    name: Publish to npm (OIDC Trusted Publishing)
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release
      id-token: write   # OIDC trusted publishing (无需长期 token)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm with OIDC support
        run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG" || { echo "tag 与 package.json 版本不一致"; exit 1; }
      - name: Check tarball contents (no session data / secrets)
        run: |
          npm pack --silent --json > pack.json
          node -e '
            const p = require("./pack.json")[0];
            const bad = p.files.map(f => f.path).filter(x =>
              /(^|\/)(context-data\.js|data\/|usage-cluster|session\.v4|\.credentials)/.test(x)
            );
            if (bad.length) { console.error("tarball 含私有数据:", bad); process.exit(1); }
            console.log("tarball files:", p.files.length, "size:", p.size);
          '
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Create GitHub Release with tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGZ="$(node -e 'const p=require("./pack.json")[0];process.stdout.write(p.filename)')"
          gh release create "$GITHUB_REF_NAME" "$TGZ" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes